name: Noven OpenAI synthetic guardrails

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/analysis-provider-evaluation.yml
      - netlify/functions/_analisis_policy.ts
      - netlify/functions/analisis.ts
      - scripts/provider-evaluation/**

permissions:
  contents: read

concurrency:
  group: noven-openai-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAI credential and fixed configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:analysis-providers -- --preflight

      - name: Evaluate deterministic synthetic corpus
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:analysis-providers -- --output .artifacts/provider-evaluation/openai-us.json

      - name: Upload synthetic evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openai-synthetic-guardrail-evidence
          path: .artifacts/provider-evaluation/openai-us.json
          if-no-files-found: warn
          retention-days: 30
