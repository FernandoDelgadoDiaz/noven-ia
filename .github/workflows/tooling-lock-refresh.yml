name: Tooling Lock Refresh

on:
  push:
    branches:
      - security/vite6-tooling-audit
    paths:
      - .github/workflows/tooling-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/vite6-tooling-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate npm lockfile for minimal secure Vite 6
        run: npm install --save-dev --package-lock-only --ignore-scripts vite@6.4.3 @vitejs/plugin-react@4.3.4
      - name: Commit generated manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Vite tooling to secure 6.4.3"
          git push origin HEAD:security/vite6-tooling-audit
