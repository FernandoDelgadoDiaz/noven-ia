name: Apply Radar Zonal UI Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-radar-zonal-ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/radar-zonal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded patch
        run: python3 scripts/apply-radar-zonal-ui-patch.py

      - name: Remove patch helper
        run: rm scripts/apply-radar-zonal-ui-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx src/components/layout/AppLayout.tsx scripts/apply-radar-zonal-ui-patch.py
          git commit -m "feat(radar-zonal): connect selective inbox to dashboard"
          git push origin HEAD:feat/radar-zonal-v1
