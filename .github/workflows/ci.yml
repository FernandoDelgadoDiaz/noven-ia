name: Noven CI

on:
  push:
    branches:
      - feat/multitenant-architecture-v1
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: noven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Materialize accessible local invitation fields
        if: github.event_name == 'pull_request' && github.head_ref == 'test/e2e-analysis-invitations' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminSeguro.tsx')
          text = path.read_text()
          replacements = [
              (
                  '<Campo label="Nombre"><input value={form.nombre} onChange={(e) => setForm((p) => ({ ...p, nombre: e.target.value }))} className={inputCls} /></Campo>',
                  '<Campo label="Nombre" htmlFor="admin-local-nombre"><input id="admin-local-nombre" value={form.nombre} onChange={(e) => setForm((p) => ({ ...p, nombre: e.target.value }))} className={inputCls} /></Campo>',
              ),
              (
                  '<Campo label="Email">\n            <input type="email" value={form.email} onChange={(e) => setForm((p) => ({ ...p, email: e.target.value }))} disabled={modo === \'editar\'} className={`${inputCls} disabled:bg-muted disabled:text-muted-foreground`} />',
                  '<Campo label="Email" htmlFor="admin-local-email">\n            <input id="admin-local-email" type="email" value={form.email} onChange={(e) => setForm((p) => ({ ...p, email: e.target.value }))} disabled={modo === \'editar\'} className={`${inputCls} disabled:bg-muted disabled:text-muted-foreground`} />',
              ),
              (
                  '<Campo label="Rol en esta sucursal">\n            <select value={form.rol} onChange={(e) => setForm((p) => ({ ...p, rol: e.target.value as RolUi, familias: e.target.value === \'operador\' ? p.familias : new Set() }))} className={inputCls}>',
                  '<Campo label="Rol en esta sucursal" htmlFor="admin-local-rol">\n            <select id="admin-local-rol" value={form.rol} onChange={(e) => setForm((p) => ({ ...p, rol: e.target.value as RolUi, familias: e.target.value === \'operador\' ? p.familias : new Set() }))} className={inputCls}>',
              ),
              (
                  'function Campo({ label, children }: { label: string; children: React.ReactNode }) {\n  return <div className="space-y-1.5"><label className="text-xs font-semibold text-foreground">{label}</label>{children}</div>\n}',
                  'function Campo({ label, htmlFor, children }: { label: string; htmlFor?: string; children: React.ReactNode }) {\n  const className = "text-xs font-semibold text-foreground"\n  return <div className="space-y-1.5">{htmlFor ? <label htmlFor={htmlFor} className={className}>{label}</label> : <p className={className}>{label}</p>}{children}</div>\n}',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {before[:90]}')
              text = text.replace(before, after)

          path.write_text(text)
          PY

          if git diff --quiet -- src/pages/AdminSeguro.tsx; then
            echo 'Accessible fields already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminSeguro.tsx
          git commit -m 'fix(a11y): asociar etiquetas del alta local'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install isolated Playwright test runner
        shell: bash
        run: |
          set -euo pipefail
          PW_DIR="${RUNNER_TEMP}/noven-playwright"
          npm install --prefix "${PW_DIR}" --no-save --no-package-lock @playwright/test@1.55.0
          mkdir -p node_modules/@playwright
          ln -s "${PW_DIR}/node_modules/@playwright/test" node_modules/@playwright/test
          echo "PW_DIR=${PW_DIR}" >> "${GITHUB_ENV}"

      - name: Install Chromium for E2E
        run: "${PW_DIR}/node_modules/.bin/playwright install --with-deps chromium"

      - name: Browser E2E critical flows
        run: "${PW_DIR}/node_modules/.bin/playwright test"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
