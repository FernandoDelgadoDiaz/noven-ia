name: Noven CI

on:
  push:
    branches:
      - feat/multitenant-architecture-v1
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: noven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E critical flows
        run: npx playwright test

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
