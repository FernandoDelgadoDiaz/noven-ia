name: Noven CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: noven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Antes de todo lo demás: una credencial filtrada no mejora porque los
      # tests pasen, y cuanto antes falle menos tiempo de runner se gasta.
      # Se escanea el árbol de trabajo, no el historial: el riesgo real es el
      # archivo de diagnóstico pegado en un PR, y escanear el historial completo
      # en cada corrida marca lo mismo siempre hasta que nadie lee la salida.
      - name: Secret scanning
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Baseline V1 replay, structural fingerprint and live Supabase
        shell: bash
        env:
          NOVEN_REPLAY_DIFF_OUTPUT: ${{ runner.temp }}/structural-diff.json
          NOVEN_REPLAY_KEEP_RUNNING: "1"
          NOVEN_REPLAY_WORKSPACE: ${{ runner.temp }}/noven-live-isolation
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: |
          set -euo pipefail
          ./scripts/migration-replay/run-baseline-replay.sh 2>&1 | tee baseline-replay.log

      - name: Export ephemeral Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/noven-live-isolation/supabase-local.env"
          set +a
          {
            echo "NOVEN_EPHEMERAL_REPLAY=1"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "${GITHUB_ENV}"

      - name: Live isolation Gates 1-3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-isolation/gates-1-3.mjs 2>&1 | tee live-isolation.log

      - name: Live quota enforcement
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-isolation/cuota-analisis.mjs 2>&1 | tee live-cuota.log

      - name: Upload baseline and isolation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-isolation-diagnostics
          path: |
            baseline-replay.log
            gitleaks.sarif
            live-isolation.log
            live-cuota.log
            ${{ runner.temp }}/structural-diff.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install isolated Playwright test runner
        shell: bash
        run: |
          set -euo pipefail
          PW_DIR="${RUNNER_TEMP}/noven-playwright"
          npm install --prefix "${PW_DIR}" --no-save --no-package-lock @playwright/test@1.55.0
          mkdir -p node_modules/@playwright
          ln -s "${PW_DIR}/node_modules/@playwright/test" node_modules/@playwright/test
          echo "PW_DIR=${PW_DIR}" >> "${GITHUB_ENV}"

      - name: Install Chromium for E2E
        run: "${PW_DIR}/node_modules/.bin/playwright install --with-deps chromium"

      - name: Browser E2E critical flows
        run: "${PW_DIR}/node_modules/.bin/playwright test"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop ephemeral Supabase
        if: always()
        shell: bash
        run: |
          if [[ -d "${RUNNER_TEMP}/noven-live-isolation/supabase" ]]; then
            cd "${RUNNER_TEMP}/noven-live-isolation"
            supabase stop --no-backup || true
          fi
