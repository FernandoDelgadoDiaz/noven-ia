name: Noven CI

on:
  push:
    branches:
      - feat/multitenant-architecture-v1
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: noven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral Supabase and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
          supabase db reset
          supabase status -o env > "${RUNNER_TEMP}/supabase-local.env"
          source "${RUNNER_TEMP}/supabase-local.env"
          echo "VITE_SUPABASE_URL=${API_URL}" >> "${GITHUB_ENV}"
          echo "SUPABASE_URL=${API_URL}" >> "${GITHUB_ENV}"
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> "${GITHUB_ENV}"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "${GITHUB_ENV}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "${GITHUB_ENV}"

      - name: Live isolation replay probe
        run: node scripts/live-isolation/probe.mjs

      - name: Install isolated Playwright test runner
        shell: bash
        run: |
          set -euo pipefail
          PW_DIR="${RUNNER_TEMP}/noven-playwright"
          npm install --prefix "${PW_DIR}" --no-save --no-package-lock @playwright/test@1.55.0
          mkdir -p node_modules/@playwright
          ln -s "${PW_DIR}/node_modules/@playwright/test" node_modules/@playwright/test
          echo "PW_DIR=${PW_DIR}" >> "${GITHUB_ENV}"

      - name: Install Chromium for E2E
        run: "${PW_DIR}/node_modules/.bin/playwright install --with-deps chromium"

      - name: Browser E2E critical flows
        run: "${PW_DIR}/node_modules/.bin/playwright test"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup || true
