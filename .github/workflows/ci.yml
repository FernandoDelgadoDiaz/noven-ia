name: Noven CI

on:
  push:
    branches:
      - feat/multitenant-architecture-v1
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: noven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit before remediation
        run: npm audit --omit=dev --json || true

      - name: Generate safe lock remediation without force
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only || true
          echo '--- AUDIT AFTER SAFE LOCK FIX ---'
          npm audit --json || true
          echo '--- RUNTIME AUDIT AFTER SAFE LOCK FIX ---'
          npm audit --omit=dev --json || true
          echo '--- LOCK DIFF STAT ---'
          git diff --stat -- package-lock.json
          echo '--- TOP LEVEL AFTER FIX ---'
          npm ls react-router-dom react-router vite esbuild postcss nanoid js-yaml brace-expansion @babel/core --depth=1 || true

      - name: Commit safe lock remediation to audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/dependency-vulnerabilities' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already remediated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): remediate runtime vulnerabilities'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install isolated Playwright test runner
        shell: bash
        run: |
          set -euo pipefail
          PW_DIR="${RUNNER_TEMP}/noven-playwright"
          npm install --prefix "${PW_DIR}" --no-save --no-package-lock @playwright/test@1.55.0
          mkdir -p node_modules/@playwright
          ln -s "${PW_DIR}/node_modules/@playwright/test" node_modules/@playwright/test
          echo "PW_DIR=${PW_DIR}" >> "${GITHUB_ENV}"

      - name: Install Chromium for E2E
        run: "${PW_DIR}/node_modules/.bin/playwright install --with-deps chromium"

      - name: Browser E2E critical flows
        run: "${PW_DIR}/node_modules/.bin/playwright test"

      - name: Upload remediated lock and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation
          path: |
            package-lock.json
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
