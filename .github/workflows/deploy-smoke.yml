name: Production Deploy Smoke

on:
  push:
    branches:
      - master
    paths:
      - public/deploy-marker.txt
      - .github/workflows/deploy-smoke.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Netlify deployment
        env:
          EXPECTED_MARKER: noven-audit-post-performance-deploy-check-20260828-c
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            actual="$(curl -fsS "${SITE_URL}/deploy-marker.txt" 2>/dev/null || true)"
            if [ "${actual}" = "${EXPECTED_MARKER}" ]; then
              echo "Exact deploy marker found."
              exit 0
            fi
            sleep 10
          done
          echo "Expected deploy marker was not published."
          exit 1

      - name: Verify SPA shell
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS "${SITE_URL}/")"
          printf '%s' "${html}" | grep -q '<div id="root"></div>'

      - name: Verify analysis function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/analysis-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/analisis" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify Radar Zonal function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/radar-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/enviar-push-radar-zonal" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify access admin function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/access-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/admin-accesos" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify local admin function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/local-admin-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/admin-sucursal" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify invitation management function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/invitations-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/admin-invitaciones" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify urgent push function exists
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/push-body -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/enviar-push" -H 'Content-Type: application/json' -d '{}')"
          test "${status}" = "401"

      - name: Verify legacy admin endpoints are retired
        env:
          SITE_URL: https://noven-ia.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in crear-usuario listar-usuarios; do
            for method in GET POST; do
              body="/tmp/legacy-${endpoint}-${method}"
              if [ "${method}" = "POST" ]; then
                status="$(curl -sS -o "${body}" -w '%{http_code}' -X POST "${SITE_URL}/.netlify/functions/${endpoint}" -H 'Content-Type: application/json' -d '{}')"
              else
                status="$(curl -sS -o "${body}" -w '%{http_code}' "${SITE_URL}/.netlify/functions/${endpoint}")"
              fi
              echo "${endpoint} ${method}: HTTP ${status}"
              if [ "${status}" = "404" ]; then
                continue
              fi
              test "${status}" = "200"
              grep -q '<div id="root"></div>' "${body}"
            done
          done
