name: Temp Apply Dashboard Image V2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/temp-apply-dashboard-image-v2.yml

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-image-pipeline-v2
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_dashboard_image_v2.py

      - name: Verify
        run: |
          npm ci
          npm run test
          npm run lint
          npm run build

      - name: Commit to feature branch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/hooks/useVencimientos.ts src/pages/Dashboard.tsx src/components/dashboard/AlertaItem.tsx src/components/dashboard/EditarVencimientoModalSeguro.tsx
          git commit -m "feat(ui): compact dashboard and optimize product images"
          git push origin HEAD:feat/dashboard-image-pipeline-v2
