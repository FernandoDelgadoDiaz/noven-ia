<title>¿Da para asado?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Asistente para decidir cuándo hacer un asado al aire libre en Río Gallegos según el pronóstico real de Open-Meteo.">
<meta name="theme-color" content="#0C0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna mobile-first (máx. 560px): veredicto de hoy → mejor de la semana → ranking de ventanas → gráfico horario → método. */
:root {
  /* Identidad única: carbón, brasa y ámbar (inspirada en el mockup aprobado). Sin variante clara a propósito. */
  color-scheme: dark;
  --bg: #0C0806;
  --bg-2: #120C09;
  --surface: #1A110C;
  --surface-2: #231710;
  --tile: rgba(255, 214, 170, .045);
  --line: #34231A;
  --ink: #FAEFE3;
  --muted: #BFA792;
  --ember: #F28A22;
  --ember-2: #FFB547;
  --ember-3: #E5661A;
  --good: #63D08A;
  --warn: #F5BC45;
  --bad: #FF6B57;
  --rain: #78BCE3;
  --temp: #F6D7A0;
  --night: rgba(0, 0, 0, .3);
  --past: rgba(0, 0, 0, .42);
  --shadow: 0 1px 0 rgba(255, 210, 160, .05) inset, 0 14px 34px rgba(0, 0, 0, .5);
  --card: linear-gradient(180deg, rgba(40, 26, 18, .96) 0%, rgba(22, 14, 10, .98) 100%);
  --card-line: rgba(255, 170, 90, .16);
  --glow: rgba(242, 138, 34, .18);
  --amber-grad: linear-gradient(180deg, #FFB547 0%, #F28A22 55%, #E5661A 100%);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  display: flex; flex-direction: column; gap: 18px;
}

/* Encabezado */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding-block: 14px 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--ember-2); flex: none; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 850; font-stretch: 112%;
  font-size: 22px; letter-spacing: -.01em; line-height: 1.05;
}
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:active { transform: scale(.96); }
.icon-btn[disabled] { opacity: .5; cursor: default; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: -8px; }
.meta b { color: var(--ink); font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; vertical-align: middle; }
.dot.stale { background: var(--warn); }

/* Avisos */
.notice {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md);
  padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px;
}
.notice.error { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.notice h3 { margin: 0 0 2px; font-size: 14.5px; }
.notice p { margin: 0; color: var(--muted); }
.notice .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn.primary { background: var(--ember); border-color: var(--ember); color: #fff; }

/* Veredicto */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-lg);
  background: var(--surface); box-shadow: var(--shadow);
  padding: 20px 18px 18px;
  --tone: var(--muted);
  animation: rise .5s ease-out both;
}
.hero.ideal { --tone: var(--good); }
.hero.precaucion { --tone: var(--warn); }
.hero.no { --tone: var(--bad); }
.hero::before {
  content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px;
  background: radial-gradient(circle, color-mix(in srgb, var(--tone) 38%, transparent) 0%, transparent 68%);
  animation: ember 5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes ember { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes rise { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.verdict {
  position: relative; margin: 6px 0 2px; font-family: var(--font-display); font-weight: 900; font-stretch: 118%;
  font-size: clamp(30px, 9vw, 40px); line-height: 1; letter-spacing: -.02em; text-wrap: balance;
  display: flex; align-items: center; gap: 10px;
}
.verdict .chip-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tone); flex: none; box-shadow: 0 0 0 5px color-mix(in srgb, var(--tone) 22%, transparent); }
.hero-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero-title { min-width: 0; flex: 1; }
.hero-head .ring { flex: none; margin: 2px 0 14px; }
.best-time { position: relative; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.best-time .big { font-family: var(--font-display); font-weight: 800; font-stretch: 100%; font-size: 26px; letter-spacing: -.01em; }
.best-time .sub { color: var(--muted); font-size: 13.5px; }
.stats { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.stat .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
.stat .s { color: var(--muted); font-size: 12.5px; }
.stat.flag .v { color: var(--bad); }
.stat.caution .v { color: var(--warn); }
.say { position: relative; margin: 14px 0 0; font-size: 15.5px; line-height: 1.5; text-wrap: pretty; }
.reasons { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.reasons li { display: flex; gap: 8px; align-items: flex-start; }
.reasons li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--warn); }
.reasons li.no::before { background: var(--bad); }

/* Mejor de la semana */
.pick {
  border-radius: var(--r-lg); padding: 16px 18px; background: var(--ink); color: var(--bg);
  display: flex; gap: 12px; align-items: flex-start; animation: rise .6s ease-out both;
}
.pick .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.pick p { margin: 4px 0 0; font-size: 15.5px; line-height: 1.5; text-wrap: pretty; }
.pick .flame { color: var(--ember-2); flex: none; margin-top: 2px; }

.now-strip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); padding: 0 2px; }
.now-strip b { color: var(--ink); font-weight: 600; }

/* Secciones */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 2px 0; }
.section-h h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-stretch: 108%; font-size: 20px; letter-spacing: -.01em; }
.section-h span { color: var(--muted); font-size: 12.5px; }

.opps { display: flex; flex-direction: column; gap: 10px; }
.opp {
  text-align: left; width: 100%; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md);
  padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
  animation: rise .5s ease-out both;
}
.opp:hover { border-color: color-mix(in srgb, var(--ember) 40%, var(--line)); }
.opp.selected { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.opp-day { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opp-day strong { font-size: 16px; font-weight: 700; }
.opp-day .date { color: var(--muted); font-size: 13px; }
.opp-time { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; margin-top: 2px; }
.opp-time small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.opp-metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.m { background: var(--surface-2); border-radius: 9px; padding: 7px 8px; min-width: 0; }
.m .k { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .v { font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.m .v.bad { color: var(--bad); }
.m .v.warn { color: var(--warn); }
.opp .reasons { grid-column: 1 / -1; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px 3px 7px;
  font-size: 12px; font-weight: 700; white-space: nowrap;
  background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone);
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tone-ideal { --tone: var(--good); }
.tone-precaucion { --tone: var(--warn); }
.tone-no { --tone: var(--bad); }
.tone-sindatos, .tone-pasado { --tone: var(--muted); }
.ring { position: relative; width: 56px; height: 56px; }
.ring svg { display: block; }
.ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.ring .l { position: absolute; left: 0; right: 0; bottom: -14px; text-align: center; font-size: 10px; color: var(--muted); font-weight: 600; }
.opp.empty { cursor: default; grid-template-columns: 1fr; }
.opp.empty p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

.span-note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
details.discarded summary { color: var(--ink); }
.discard-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; }
.discard-item { border-top: 1px solid var(--line); padding-top: 10px; }
.discard-item:first-child { border-top: 0; padding-top: 0; }
.discard-title { display: flex; gap: 8px; align-items: baseline; }
.discard-title strong { font-size: 14.5px; }
.discard-item p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.dot-tone { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; transform: translateY(-1px); }

.now-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 14px 12px; }
.now-card .section-h { margin: 0 0 10px; }
.now-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.src-box { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.src-k { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.src-v { font-size: 16px; font-weight: 700; margin-top: 3px; overflow-wrap: anywhere; }
.src-s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.src-t { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.now-hour { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; font-weight: 600; }
.cmp { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
.now-best { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.now-best.tone-ideal { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.now-best.tone-precaucion { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.now-best-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.now-best-head .ring { flex: none; margin-bottom: 14px; }
ul.why { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.alts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.alt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.alt-score { margin-left: auto; font-weight: 700; }
.src-foot { font-size: 12px; color: var(--muted); margin: 12px 0 0; line-height: 1.45; }
.changes { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-md); padding: 12px 14px; }
.chg-list { margin: 6px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.chg-add strong { color: var(--good); }
.chg-rem strong { color: var(--bad); }
.why-box { margin-top: 10px; }
.why-btn { font-size: 13.5px; padding: 7px 12px; width: 100%; text-align: left; }
.why-ans { margin-top: 8px; background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; }
.why-ans p { margin: 4px 0 0; }
@media (max-width: 360px) { .now-grid { grid-template-columns: 1fr; } }

/* Gráfico */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 12px 12px; }
.days { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day-chip {
  flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px;
  padding: 7px 10px 6px; min-width: 62px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.day-chip .d { font-size: 12px; font-weight: 700; }
.day-chip .dd { font-size: 11px; color: var(--muted); }
.day-chip .bar { width: 22px; height: 4px; border-radius: 2px; background: var(--tone); margin-top: 2px; }
.day-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day-chip[aria-pressed="true"] .dd { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.sun-row { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; padding: 0 4px 6px; flex-wrap: wrap; }
.sun-row span { display: inline-flex; gap: 5px; align-items: center; }
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 6px 4px 0; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 11px; height: 11px; border: 0; border-radius: 3px; }
.hour-detail { margin-top: 10px; background: var(--surface-2); border-radius: var(--r-md); padding: 12px; }
.hour-detail .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hour-detail .row1 strong { font-size: 17px; }
.hour-detail .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.hour-detail .grid div { min-width: 0; }
.hour-detail .grid .k { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.hour-detail .grid .v { font-size: 15px; font-weight: 700; }

/* Método */
details.method { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px 16px; }
details.method summary { cursor: pointer; padding: 12px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.method summary::-webkit-details-marker { display: none; }
details.method[open] summary .chev { transform: rotate(180deg); }
.method-body { padding-bottom: 14px; font-size: 14px; color: var(--ink); }
.method-body p { margin: 0 0 10px; max-width: 65ch; }
.method-body h4 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.rules { border-collapse: collapse; width: 100%; font-size: 13px; }
table.rules th, table.rules td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.rules th { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.bd { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.bd .track { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bd .fill { height: 100%; background: var(--ember); border-radius: 4px; }

.disclaimer { font-size: 12.5px; color: var(--muted); line-height: 1.5; padding: 0 2px; }
.disclaimer strong { color: var(--ink); }

/* Ajustes */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 6, 4, .5); z-index: 20; animation: fade .2s ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-top: 10px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  animation: up .25s ease-out both;
}
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field-label label, .field-label span.t { font-weight: 700; font-size: 14.5px; }
.field-label output { font-weight: 700; color: var(--ember); font-size: 15px; }
.field small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 4px; font-weight: 600; font-size: 14px; cursor: pointer; min-width: 0; }
.seg button small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); color: var(--ember); }
input[type=range] { width: 100%; accent-color: var(--ember); height: 28px; }

/* Carga */
.skel { border-radius: var(--r-lg); background: var(--surface); padding: 20px 18px; box-shadow: var(--shadow); }
.skel .bar { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; margin-top: 12px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 380px) {
  .opp-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hour-detail .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ===== v3: identidad premium ===== */

.masthead::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, transparent 60%, var(--bg) 100%), radial-gradient(110% 90% at 0% 45%, var(--bg) 28%, transparent 68%); pointer-events: none; }
.mast-actions { position: absolute; top: 12px; right: 0; display: flex; gap: 8px; z-index: 2; }
.icon-btn.glass { background: rgba(15, 10, 7, .55); border-color: rgba(242, 138, 34, .3); color: #F8ECDF; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.mast-brand { display: flex; align-items: center; gap: 10px; margin-top: 34px; }
.mast-flame { width: 54px; height: 68px; flex: none; filter: drop-shadow(0 0 14px rgba(242, 107, 29, .55)); }
.mast-brand h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-stretch: 100%; line-height: .95; letter-spacing: -.02em; color: var(--ink); text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
.mast-brand h1 span { display: block; font-size: 25px; }
.mast-brand h1 .big { font-size: 42px; }
.swoosh { width: 168px; height: 7px; margin: 6px 0 0 64px; border-radius: 999px; background: linear-gradient(90deg, #F26B1D, #FFB347 70%, transparent); transform: skewX(-18deg); }
.loc { display: flex; align-items: center; gap: 6px; margin: 14px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.loc svg { color: var(--ember-2); }
.embers { position: absolute; z-index: -1; inset: 0; pointer-events: none; }
.embers i { position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: #FFB347; box-shadow: 0 0 6px 2px rgba(255, 140, 40, .7); opacity: 0; animation: ember-rise 6s linear infinite; will-change: transform, opacity; }
.embers i:nth-child(1) { left: 52%; animation-delay: 0s; } .embers i:nth-child(2) { left: 61%; animation-delay: 1.1s; animation-duration: 7s; }
.embers i:nth-child(3) { left: 70%; animation-delay: 2.3s; } .embers i:nth-child(4) { left: 78%; animation-delay: .6s; animation-duration: 5.2s; }
.embers i:nth-child(5) { left: 86%; animation-delay: 3.1s; } .embers i:nth-child(6) { left: 93%; animation-delay: 1.7s; animation-duration: 6.6s; }
.embers i:nth-child(7) { left: 57%; animation-delay: 4s; width: 3px; height: 3px; } .embers i:nth-child(8) { left: 66%; animation-delay: 4.8s; width: 3px; height: 3px; }
.embers i:nth-child(9) { left: 82%; animation-delay: 2.8s; width: 3px; height: 3px; } .embers i:nth-child(10) { left: 74%; animation-delay: 5.4s; }
.embers i:nth-child(11) { left: 90%; animation-delay: 3.9s; width: 3px; height: 3px; } .embers i:nth-child(12) { left: 47%; animation-delay: 2s; width: 3px; height: 3px; }
@keyframes ember-rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .95; } 60% { opacity: .6; } 100% { transform: translate(-18px, -190px); opacity: 0; } }
.tabbar { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(20, 13, 9, .92); border-top: 1px solid rgba(242, 138, 34, .2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tab { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 12.5px; font-weight: 600; cursor: pointer; min-width: 0; }
.tab[aria-current="page"] { color: var(--ember-2); }
@media (min-width: 600px) { .tabbar { left: 50%; right: auto; width: 560px; transform: translateX(-50%); border: 1px solid rgba(242, 138, 34, .2); border-bottom: 0; border-radius: 18px 18px 0 0; } }

/* Planificador */
.card { border-radius: var(--r-lg); padding: 14px 16px; }
.card.soft { padding: 12px 14px; }
.planner { display: flex; flex-direction: column; gap: 14px; }
.plan-intro { display: flex; gap: 14px; align-items: flex-start; }
.plan-intro h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 25px; letter-spacing: -.01em; }
.plan-intro p { margin: 4px 0 0; color: var(--muted); }
.amber { color: var(--ember-2); flex: none; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chips::-webkit-scrollbar { display: none; }
.chip { min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--card-line); background: var(--surface-2); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ember-2); background: color-mix(in srgb, var(--ember) 22%, var(--surface-2)); box-shadow: 0 0 0 1px var(--ember-2) inset; }
.cal { padding: 12px 10px 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 6px; }
.cal-head h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.cal-nav { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--card-line); background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; }
.cal-dow { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 6px 0; }
.cal-cell { position: relative; height: 42px; border: 0; background: transparent; color: var(--ink); font-size: 17px; font-weight: 600; cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.cal-cell span { position: relative; z-index: 1; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; }
.cal-cell.empty { cursor: default; }
.cal-cell.past { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.cal-cell.today span { box-shadow: 0 0 0 1.5px var(--muted) inset; }
.cal-cell.hol::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ember-2); }
.cal-cell.in { background: color-mix(in srgb, var(--ember) 55%, transparent); color: #fff; }
.cal-cell.start { border-radius: 21px 0 0 21px; } .cal-cell.end { border-radius: 0 21px 21px 0; } .cal-cell.start.end { border-radius: 21px; }
.cal-cell.start span, .cal-cell.end span { background: linear-gradient(180deg, #FFB547, #F28A22); color: #1A0F09; font-weight: 800; }
.cal-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 6px 0; color: var(--ink); font-size: 14.5px; }
.pill { margin-left: auto; border: 1.5px solid var(--ember); color: var(--ember-2); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 16px; white-space: nowrap; }
.pill.small { font-size: 12.5px; padding: 2px 9px; margin-left: 0; }
.plan-res { display: flex; flex-direction: column; gap: 12px; }
.plan-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); }
.plan-sum b { color: var(--ink); }
.trend-card { position: relative; overflow: hidden; display: flex; padding: 0; border-color: color-mix(in srgb, var(--ember) 45%, transparent); }
.trend-body { position: relative; z-index: 1; padding: 14px 16px; max-width: 80%; }
.trend-body h3 { margin: 0; display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.trend-body h3 svg { color: var(--ember-2); }
.trend-body p { margin: 6px 0 0; }

.clim { font-size: 14px; }
.btn.ghost { margin-top: 10px; background: transparent; border-color: var(--ember); color: var(--ember-2); }
.btn.big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; font-size: 17px; border-radius: 18px; background: linear-gradient(180deg, #F9A23B, #E7731A); border: 0; color: #1A0F09; box-shadow: 0 8px 26px rgba(242, 138, 34, .3); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.pd-list { display: flex; flex-direction: column; gap: 8px; }
.pd { padding: 12px 14px; }
.pd p { margin: 6px 0 0; }
.pd-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.pd-row .ring { flex: none; margin-bottom: 14px; }
.pd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hol-tag, .tag { font-size: 11.5px; font-weight: 700; color: var(--ember-2); border: 1px solid var(--card-line); border-radius: 999px; padding: 1px 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.save-form { display: flex; flex-direction: column; gap: 8px; }
.save-form label { font-weight: 700; }
.save-form input { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--card-line); border-radius: 12px; padding: 11px 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.events { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.event p { margin: 6px 0 0; }
.ev-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ev-change { color: var(--ember-2); font-weight: 600; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
@media (prefers-reduced-motion: reduce) { .embers { display: none; } }
@media (max-width: 360px) { .mast-brand h1 .big { font-size: 36px; } .cal-cell span { width: 34px; height: 34px; } .cal-cell { font-size: 15.5px; } }

/* ===== v4: rediseño integral oscuro premium (referencia: mockup aprobado) ===== */
html, body { background: var(--bg); }
body { color: var(--ink);
  background:
    radial-gradient(70% 30% at 0% 100%, rgba(229, 102, 26, .07), transparent 70%),
    var(--bg); background-repeat: no-repeat; min-height: 100%; }
::selection { background: rgba(242, 138, 34, .45); color: #fff; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ember-2); outline-offset: 2px; }

/* Tarjetas: carbón cálido, borde ámbar finito, sombra profunda */
.hero, .now-card, .chart-card, .opp, details.method, .changes, .card, .skel, .pick, .notice {
  background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow); border-radius: var(--r-lg); color: var(--ink); }
.opp { border-radius: 20px; }
.notice.error { border-color: rgba(255, 107, 87, .45); }
.notice.warn { border-color: rgba(245, 188, 69, .4); }
.notice p, .src-s, .src-t, .muted, .disclaimer, .section-h span, .opp-day .date, .opp-time small, .best-time .sub { color: var(--muted); }
.section-h h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; color: var(--ink); min-width: 0; }
.section-h span { white-space: nowrap; flex: none; }
@media (max-width: 440px) { .opp-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.eyebrow { color: var(--ember-2); opacity: .9; }

/* Veredicto de hoy */
.hero { padding: 20px 18px 18px; box-shadow: var(--shadow), 0 0 0 1px rgba(255, 170, 90, .04), 0 18px 60px var(--glow); }
.hero::before { width: 300px; height: 300px; right: -110px; top: -130px; background: radial-gradient(circle, color-mix(in srgb, var(--tone) 34%, transparent) 0%, transparent 66%); }
.verdict { color: var(--ink); font-stretch: 112%; }
.verdict .chip-dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--tone) 22%, transparent), 0 0 18px var(--tone); }
.best-time .big { background: var(--amber-grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 30px; }
.stat, .m, .src-box, .hour-detail, .why-ans { background: var(--tile); border: 1px solid rgba(255, 170, 90, .1); border-radius: var(--r-sm); }
.stat { padding: 11px 12px; }
.stat .k, .m .k, .src-k, .hour-detail .grid .k { color: var(--muted); }
.stat .k svg { color: var(--ember-2); }
.stat .v { color: var(--ink); font-size: 20px; }
.stat.flag { border-color: rgba(255, 107, 87, .35); } .stat.flag .v { color: var(--bad); }
.stat.caution { border-color: rgba(245, 188, 69, .3); } .stat.caution .v { color: var(--warn); }
.m .v.bad { color: var(--bad); } .m .v.warn { color: var(--warn); }
.say { color: color-mix(in srgb, var(--ink) 92%, var(--muted)); }

/* Puntaje: anillo con brillo del color de estado */
.ring svg circle:first-child { stroke: rgba(255, 230, 200, .08); }
.ring { border-radius: 50%; box-shadow: 0 0 22px rgba(255, 160, 60, .12); }
.ring .n { color: var(--ink); font-family: var(--font-display); font-weight: 800; }
.ring .l { color: var(--muted); }

/* Estados (verde, ámbar, rojo) bien diferenciados */
.badge { border: 1px solid color-mix(in srgb, var(--tone) 40%, transparent); background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); }
.reasons li::before { box-shadow: 0 0 6px currentColor; }

/* «La mejor de la semana»: ya no es una tarjeta invertida clara */
.pick { background: linear-gradient(135deg, rgba(229, 102, 26, .22), rgba(26, 17, 12, .96) 55%); border-color: rgba(255, 170, 90, .32); }
.pick .eyebrow { color: var(--ember-2); }
.pick p { color: var(--ink); }

/* Sección «ahora» y cambios */
.now-best { background: rgba(255, 214, 170, .03); border-color: var(--card-line); border-radius: 18px; }
.changes { border-style: solid; }
.alt-row { padding: 6px 0; border-top: 1px solid rgba(255, 170, 90, .08); }

/* Controles segmentados y botones */
.seg { background: rgba(255, 214, 170, .05); border: 1px solid rgba(255, 170, 90, .1); border-radius: 14px; }
.seg button { color: var(--ink); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--amber-grad); color: #1A0E07; box-shadow: 0 4px 14px rgba(242, 138, 34, .3); }
.seg button[aria-pressed="true"] small { color: rgba(26, 14, 7, .75); }
.btn { background: rgba(255, 214, 170, .06); border-color: rgba(255, 170, 90, .22); color: var(--ink); min-height: 44px; }
.btn.primary { background: var(--amber-grad); border: 0; color: #1A0E07; }

        ${v != null && html`<circle cx="28" cy="28" r=${r} fill="none" stroke=${tone} strokeWidth="6" strokeLinecap="round" strokeDasharray=${(c * v / 100) + " " + c} transform="rotate(-90 28 28)"/>`}
      </svg>
      <div className="n num">${v == null ? "–" : v}</div><div className="l">de 100</div>
    </div>`;
  }

  function Reasons(props) {
    if (!props.reasons || !props.reasons.length) return null;
    var list = props.max ? props.reasons.slice(0, props.max) : props.reasons;
    return html`<ul className="reasons">${list.map(function (x) { return html`<li key=${x.key} className=${x.sev === "no" ? "no" : ""}>${A.reasonText(x, props.prefs)}</li>`; })}</ul>`;
  }

  function fmtDateTime(ms) {
    try {
      var l = A.nowLocal(new Date(ms));
      return A.weekday(l.slice(0, 10)).slice(0, 3) + " " + A.shortDate(l.slice(0, 10)) + ", " + l.slice(11, 16);
    } catch (e) { return new Date(ms).toLocaleString("es-AR"); }
  }
  function range(a, b, unit) {
    var ra = Math.round(a), rb = Math.round(b);
    return ra === rb ? ra + unit : ra + "–" + rb + unit;
  }

  function fullDay(date, today) {
    var label = A.dayLabel(date, today), wd = A.weekday(date);
    return label.toLowerCase() === wd ? label + " " + A.shortDate(date) : label + ", " + wd + " " + A.shortDate(date);
  }

  // Resumen de las horas que quedan en la franja (solo informativo, no es una recomendación).
  function slotStats(hours) {
    var hs = hours.filter(function (h) { return !h.past && h.inSlot && h.cls.level !== "sindatos"; });
    if (!hs.length) return null;
    var mx = function (k) { return Math.max.apply(null, hs.map(function (h) { return h[k]; })); };
    var mn = function (k) { return Math.min.apply(null, hs.map(function (h) { return h[k]; })); };
    var temps = hs.filter(function (h) { return h.temp != null; }).map(function (h) { return h.temp; });
    var top = hs.reduce(function (a, h) { return h.wind > a.wind ? h : a; }, hs[0]);
    return {
      maxWind: mx("wind"), maxGust: mx("gust"), minFeels: mn("feels"), maxFeels: mx("feels"),
      minTemp: temps.length ? Math.min.apply(null, temps) : null, maxTemp: temps.length ? Math.max.apply(null, temps) : null,
      maxProb: mx("prob"), totalPrecip: Math.round(hs.reduce(function (s, h) { return s + h.precip; }, 0) * 10) / 10, dir: top.dir
    };
  }

  function StatsGrid(props) {
    var s = props.s, prefs = props.prefs;
    var gustFlag = s.maxGust > A.HARD.gust ? "flag" : s.maxGust > prefs.maxGust ? "caution" : "";
    var windFlag = s.maxWind > A.HARD.wind ? "flag" : s.maxWind > prefs.maxWind ? "caution" : "";
    var rainFlag = s.maxProb >= A.HARD.prob ? "flag" : s.maxProb >= 20 || s.totalPrecip > 0 ? "caution" : "";
    var feelsFlag = s.minFeels < prefs.minFeels - A.HARD.coldDelta ? "flag" : s.minFeels < prefs.minFeels ? "caution" : "";
    return html`<div className="stats">
      <div className=${"stat " + feelsFlag}><div className="k"><${I.temp} size=${15}/>Temperatura</div><div className="v num">${s.minTemp == null ? "–" : range(s.minTemp, s.maxTemp, " °C")}</div><div className="s num">Sensación ${range(s.minFeels, s.maxFeels, " °C")}</div></div>
      <div className=${"stat " + windFlag}><div className="k"><${I.wind} size=${15}/>Viento máx.</div><div className="v num">${A.fmt0(s.maxWind)} km/h</div><div className="s" style=${{ display: "flex", alignItems: "center", gap: "4px" }}>${s.dir != null && html`<${I.arrow} deg=${s.dir} size=${13}/>`}Desde el ${A.cardinal(s.dir) || "–"}</div></div>
      <div className=${"stat " + gustFlag}><div className="k"><${I.gust} size=${15}/>Ráfagas máx.</div><div className="v num">${A.fmt0(s.maxGust)} km/h</div><div className="s">Límite configurado: 40</div></div>
      <div className=${"stat " + rainFlag}><div className="k"><${I.drop} size=${15}/>Lluvia</div><div className="v num">${A.fmt0(s.maxProb)} %</div><div className="s num">${s.totalPrecip > 0 ? A.fmt1(s.totalPrecip) + " mm previstos" : "0 mm previstos"}</div></div>
    </div>`;
  }

  var NONE_TEXT = "No encontramos condiciones recomendables para hacer asado en los próximos 7 días.";
  // Si no hay recomendaciones porque faltan datos (y no por el clima), se dice eso.
  function noneText(a) {
    var futuros = a.days.filter(function (d) { return d.discard && d.discard.kind !== "pasado"; });
    return futuros.length && futuros.every(function (d) { return d.discard.kind === "sindatos"; })
      ? "Faltan datos del pronóstico (por ejemplo, las ráfagas) para evaluar los próximos 7 días. Probá actualizar más tarde."
      : NONE_TEXT;
  }

  function spanText(w) {
    var dur = w.endHour - w.startHour;
    if (!w.span || w.span.len <= dur) return null;
    return (w.spanKind === "ideal" ? "Condiciones ideales de " : "Condiciones aceptables de ") + A.hh(w.span.start) + (w.span.end === 24 ? " a la medianoche" : " a " + A.hh(w.span.end)) + " (" + w.span.len + " h seguidas)";
  }

  function Hero(props) {
    var a = props.analysis, t = a.todayInfo, prefs = a.prefs;
    if (!t) {
      return html`<section className="hero"><div className="eyebrow">Hoy</div><div className="verdict">Sin datos para hoy</div><p className="say">El pronóstico recibido no incluye el día de hoy.</p></section>`;
    }
    var w = t.top;
    var next = a.overall;
    var nextTxt = next ? "Próxima oportunidad: " + A.describeWindow(next, prefs, a.today) : noneText(a);
    if (!w) {
      var kind = t.discard ? t.discard.kind : "pasado";
      var s0 = slotStats(t.hours);
      var headline = kind === "pasado" ? "Por hoy ya fue" : kind === "sindatos" ? "Sin datos suficientes" : "Hoy no da";
      return html`<section className=${"hero " + (kind === "clima" || kind === "fragmentado" ? "no" : "")} aria-live="polite" data-today="descartado">
        <div className="eyebrow">¿Da para asado hoy?</div>
        <div className="verdict"><span className="chip-dot"></span>${headline}</div>
        <p className="say" style=${{ marginTop: "10px" }}>${kind === "pasado" ? "No quedan " + prefs.duration + " horas seguidas dentro de tu horario preferido (" + a.slot.label.toLowerCase() + ", " + a.slot.hint + ")." : A.discardText(t, prefs)}</p>
        ${t.discard && t.discard.reasons.length > 1 && html`<${Reasons} reasons=${t.discard.reasons.slice(1, 3)} prefs=${prefs}/>`}
        ${s0 && kind !== "pasado" && html`<div><div className="eyebrow" style=${{ marginTop: "14px" }}>Lo que queda de tu franja hoy</div><${StatsGrid} s=${s0} prefs=${prefs}/></div>`}
        <p className="say">${nextTxt}</p>
      </section>`;
    }
    var s = w.stats;
    var sp = spanText(w);
    return html`<section className=${"hero " + w.level} aria-live="polite" data-today=${w.level}>
      <div className="hero-head">
        <div className="hero-title">
          <div className="eyebrow">¿Da para asado hoy?</div>
          <div className="verdict"><span className="chip-dot"></span>${w.level === "ideal" ? "Sí, da" : "Da, con cuidado"}</div>
        </div>
        <${ScoreRing} value=${w.score} level=${w.level}/>
      </div>
      <div className="best-time">
        <span className="big num">${A.hh(w.startHour)} – ${A.hh(w.endHour)}</span>
        <span className="sub">Mejor horario de hoy${sp ? " · " + sp : ""}</span>
      </div>
      <${StatsGrid} s=${s} prefs=${prefs}/>
      <p className="say">${A.describeWindow(w, prefs, a.today)}</p>
      ${w.level !== "ideal" && html`<${Reasons} reasons=${w.reasons} prefs=${prefs} max=${4}/>`}
      ${t.recs.length > 1 && html`<p className="say" style=${{ fontSize: "14px", color: "var(--muted)" }}>Otras opciones hoy: ${t.recs.slice(1).map(function (r) { return A.hh(r.startHour) + "–" + A.hh(r.endHour) + " (" + LEVEL_LABEL[r.level].toLowerCase() + ")"; }).join(", ")}.</p>`}
    </section>`;
  }

  function WeekPick(props) {
    var a = props.analysis, o = a.overall;
    if (!o) {
      return html`<section className="pick" data-none="true">
        <span className="flame"><${I.alert} size=${24}/></span>
        <div><div className="eyebrow">Próximos 7 días</div><p>${noneText(a)}</p></div>
      </section>`;
    }
    if (o.date === a.today) return null; // la mejor ya está en el veredicto de hoy
    return html`<section className="pick">
      <span className="flame"><${I.flame} size=${24}/></span>
      <div><div className="eyebrow">La mejor de la semana</div><p>${A.describeWindow(o, a.prefs, a.today)}</p></div>
    </section>`;
  }

  function ageText(local, now) {
    var p = function (x) { return Date.UTC(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10), +x.slice(11, 13), +x.slice(14, 16)); };
    var m = Math.round((p(now) - p(local)) / 60000);
    return m < 1 ? "recién" : m < 60 ? "hace " + m + " min" : "hace " + Math.floor(m / 60) + " h " + (m % 60) + " min";
  }
  function endLabel(w, today) {
    var end = A.hh(w.endHour);
    return w.endHour > 24 ? end + " del " + A.weekday(A.addHours(w.startTime, w.endHour - w.startHour).slice(0, 10)) : w.endHour === 24 ? "00:00 (medianoche)" : end;
  }

  function NowSection(props) {
    var na = props.nowA, a = props.analysis, prefs = a.prefs, obs = props.obs, cur = props.current;
    var st = useState(function () { return prefs.duration >= 2 && prefs.duration <= 4 ? prefs.duration : 3; }), dur = st[0], setDur = st[1];
    var r = na.byDur[dur];
    var w = r.best;
    var o = obs && obs.data ? obs.data.latest : null;
    var cmp = props.cmp;
    var ch = na.current;
    var why = [];
    if (w) {
      var nOk = r.counts.ideal + r.counts.precaucion;
      why.push("Es " + (w.prefWhy && w.prefWhy.length ? "la elegida" : "la de mejor puntaje") + " entre " + nOk + (nOk === 1 ? " ventana aceptable" : " ventanas aceptables") + " de " + dur + " h en las próximas 24 h.");
      (w.prefWhy || []).forEach(function (p) {
        if (p.key === "luz") why.push("Se prefirió por tener luz de día: " + A.hh(p.from.startHour) + "–" + A.hh(p.from.endHour) + " tenía " + p.from.score + " puntos, apenas " + (p.from.score - w.score) + " más, pero de noche.");
        if (p.key === "slot") why.push("Se prefirió por caer en tu horario de " + a.slot.label.toLowerCase() + ".");
      });
      why.push("Ninguna hora supera los límites configurados: ráfagas previstas de hasta " + A.fmt0(w.stats.maxGust) + " km/h (límite 40) y viento previsto de hasta " + A.fmt0(w.stats.maxWind) + " km/h (límite 30).");
    }
    return html`<section className="now-card" data-now=${w ? w.level : "none"}>
      <div className="section-h"><h2>¿Da para asado ahora?</h2><span>Próximas 24 h</span></div>
      <div className="now-grid">
        <div className="src-box" data-kind="obs">
          <div className="src-k">Observado · aeropuerto (SAWG)</div>
          ${o ? html`<${React.Fragment}>
            <div className="src-v num">${o.temp == null ? "–" : o.temp + " °C"} · ${o.wind == null ? "–" : A.fmt0(o.wind) + " km/h"} ${o.dir != null ? A.cardinal(o.dir) : o.wind != null ? "variable" : ""}</div>
            <div className="src-s">${o.gust != null ? "Ráfagas de " + A.fmt0(o.gust) + " km/h" : "Sin ráfagas informadas"}${o.sky ? " · " + o.sky : ""}</div>
            <div className="src-t num">${o.local.slice(11, 16)} (${ageText(o.local, a.now)})</div>
          <//>` : html`<div className="src-s">${obs && obs.loading ? "Consultando la estación…" : "Sin observación disponible" + (obs && obs.error ? ": " + obs.error : "")}</div>`}
        </div>
        <div className="src-box" data-kind="model">
          <div className="src-k">Modelo · Open-Meteo (estimación)</div>
          ${cur && cur.temp != null ? html`<${React.Fragment}>
            <div className="src-v num">${A.fmt0(cur.temp)} °C · ${A.fmt0(cur.wind)} km/h ${A.cardinal(cur.dir)}</div>
            <div className="src-s">Sensación ${A.fmt0(cur.feels)} °C · ráfagas ${A.fmt0(cur.gust)} km/h</div>
            <div className="src-t num">${cur.time ? cur.time.slice(11, 16) : ""} · no es una medición</div>
          <//>` : html`<div className="src-s">Sin estimación actual en esta consulta.</div>`}
        </div>
      </div>
      ${ch && html`<div className="now-hour"><span>Esta hora (${A.hh(ch.hour)}):</span> <${Badge} level=${ch.cls.level}/>${ch.cls.obs ? html` <span className="src-t">según la observación</span>` : html` <span className="src-t">según el pronóstico</span>`}</div>`}
      ${ch && ch.cls.level !== "ideal" && html`<${Reasons} reasons=${ch.cls.reasons} prefs=${prefs} max=${3}/>`}
      ${cmp && o && html`<p className="cmp" data-testid="cmp">${cmpText(cmp)}</p>`}
      ${na.pleasantUnsafe && html`<div className="notice warn" style=${{ marginTop: "10px" }}><span style=${{ color: "var(--warn)", flex: "none" }}><${I.alert}/></span><div><h3>Agradable, pero no para brasas</h3><p>${A.cap(na.pleasantUnsafe.spans.map(function (x) { return "de " + x.from.slice(11, 16) + " a " + x.to.slice(11, 16); }).join(" y "))} se esperan hasta ${A.fmt0(na.pleasantUnsafe.maxTemp)} °C (sensación ${A.fmt0(na.pleasantUnsafe.maxFeels)} °C) y sin lluvia, pero con ráfagas de hasta ${A.fmt0(na.pleasantUnsafe.maxGust)} km/h${na.pleasantUnsafe.maxWind > A.HARD.wind ? " y viento de " + A.fmt0(na.pleasantUnsafe.maxWind) + " km/h" : ""}. Por encima de 40 km/h las ráfagas levantan chispas y brasas.</p></div></div>`}
      <div className="field" style=${{ marginTop: "12px" }}>
        <${Seg} id="now-dur" label="Duración a evaluar" value=${dur} onChange=${setDur} options=${[2, 3, 4].map(function (n) { return { value: n, label: n + " h" }; })}/>
      </div>
      ${w ? html`<div className=${"now-best tone-" + w.level}>
        <div className="now-best-head">
          <div style=${{ minWidth: 0 }}>
            <div className="opp-day"><strong>${A.dayLabel(w.date, a.today)}</strong><${Badge} level=${w.level}/></div>
            <div className="opp-time num">${A.hh(w.startHour)} – ${endLabel(w, a.today)}</div>
          </div>
          <${ScoreRing} value=${w.score} level=${w.level}/>
        </div>
        <ul className="why">${why.map(function (t, i) { return html`<li key=${i}>${t}</li>`; })}</ul>
        ${w.level !== "ideal" && html`<${Reasons} reasons=${w.reasons} prefs=${prefs} max=${3}/>`}
        ${r.alts.length > 0 && html`<div className="alts"><div className="eyebrow">Alternativas de ${dur} h</div>
          ${r.alts.map(function (x) { return html`<div key=${x.i0} className="alt-row"><span className="num">${A.dayLabel(x.date, a.today)} ${A.hh(x.startHour)} – ${endLabel(x, a.today)}</span><${Badge} level=${x.level}/><span className="num alt-score">${x.score}</span></div>`; })}
        </div>`}
      </div>` : html`<div className="now-best tone-no" data-none="true"><p style=${{ margin: 0 }}>En las próximas 24 horas no hay ${dur} horas seguidas aceptables para hacer asado (${r.counts.no} ventanas descartadas${r.counts.sindatos ? ", " + r.counts.sindatos + " sin datos" : ""}).</p></div>`}
      <p className="src-foot">Pronóstico: Open-Meteo${props.fcSource === "firecrawl" ? " vía Firecrawl" : ""}, consultado ${props.fcTime}. Observación: METAR de aviationweather.gov${obs && obs.data && obs.data.source === "firecrawl" ? " vía Firecrawl" : ""}${obs && obs.data ? ", consultada " + props.obsTime : ""}. La observación solo puede volver más estricta la hora actual y la siguiente; nunca las mejora.</p>
    </section>`;
  }

  function cmpText(c) {
    var parts = [];
    var hhmm = c.at.slice(11, 16);
    if (c.wind) {
      var d = c.wind.diff;
      parts.push("Viento medio observado a las " + hhmm + ": " + A.fmt0(c.wind.obs) + " km/h; el modelo daba " + A.fmt0(c.wind.fc) + " km/h para las " + c.modelTime.slice(11, 16) + (Math.abs(d) < 5 ? " (similar)." : d < 0 ? " (observado más calmo)." : " (observado más ventoso)."));
    }
    if (c.temp) parts.push("Temperatura: " + c.temp.obs + " °C observada contra " + A.fmt0(c.temp.fc) + " °C prevista.");
    parts.push(c.gust.obs != null ? "Ráfagas observadas: " + A.fmt0(c.gust.obs) + " km/h (previstas " + A.fmt0(c.gust.fc) + ")." : "Las ráfagas no se pueden comparar: el METAR solo las informa cuando superan en unos 18 km/h al viento medio, así que su ausencia no prueba que estén por debajo de las " + A.fmt0(c.gust.fc) + " km/h previstas.");
    return parts.join(" ");
  }

  function ChangesCard(props) {
    var d = props.diff;
    if (!d) return null;
    var a = props.analysis;
    var fmtW = function (w) { return A.dayLabel(w.date, a.today) + " " + A.shortDate(w.date) + ", " + A.hh(w.startHour) + "–" + A.hh(w.endHour); };
    var lvl = function (l) { return l ? LEVEL_LABEL[l].toLowerCase() : "sin datos"; };
    return html`<section className="changes" data-changed=${d.changed ? "true" : "false"}>
      <div className="eyebrow">Cambios desde la consulta anterior (${props.prevTime})</div>
      ${d.changed ? html`<ul className="chg-list">
        ${d.added.map(function (x) { return html`<li key=${"a" + x.w.date + x.w.startHour} className="chg-add"><strong>Nueva oportunidad:</strong> ${fmtW(x.w)} · ${lvl(x.w.level)} (antes: ${x.before ? lvl(x.before) : "no evaluada"}).</li>`; })}
        ${d.upgraded.map(function (x) { return html`<li key=${"u" + x.w.date + x.w.startHour} className="chg-add"><strong>Cambió:</strong> ${fmtW(x.w)} pasó de ${lvl(x.before)} a ${lvl(x.w.level)}.</li>`; })}
        ${d.removed.map(function (x) { return html`<li key=${"r" + x.w.date + x.w.startHour} className="chg-rem"><strong>Ya no se recomienda:</strong> ${fmtW(x.w)} (ahora: ${x.now ? lvl(x.now) : "fuera de la ventana analizada"}).</li>`; })}
      </ul>` : html`<p className="src-foot" style=${{ marginTop: "4px" }}>Las recomendaciones no cambiaron con el pronóstico nuevo.</p>`}
      <p className="src-foot">La app detecta cambios cuando la abrís o actualizás. No envía alertas automáticas.</p>
    </section>`;
  }

  function Metric(props) {
    return html`<div className="m"><div className="k">${props.k}</div><div className=${"v num " + (props.tone || "")}>${props.v}</div></div>`;
  }

  function OppCard(props) {
    var w = props.w, a = props.analysis, prefs = a.prefs, s = w.stats;
    var dur = w.endHour - w.startHour;
    var title = fullDay(w.date, a.today);
    var sp = spanText(w);
    return html`<button className=${"opp" + (props.selected ? " selected" : "")} onClick=${props.onSelect} style=${{ animationDelay: (props.index * 40) + "ms" }} data-level=${w.level} aria-label=${title + ", " + A.hh(w.startHour) + " a " + A.hh(w.endHour) + ", " + LEVEL_LABEL[w.level] + ", puntaje " + w.score}>
      <div style=${{ minWidth: 0 }}>
        <div className="opp-day"><strong>${title}</strong><${Badge} level=${w.level}/></div>
        <div className="opp-time num">${A.hh(w.startHour)} – ${A.hh(w.endHour)}<small>${dur} h</small></div>
        ${sp && html`<div className="span-note">${sp}</div>`}
      </div>
      <${ScoreRing} value=${w.score} level=${w.level}/>
      <div className="opp-metrics">
        <${Metric} k="Viento máx." v=${A.fmt0(s.maxWind) + " km/h"} tone=${s.maxWind > prefs.maxWind ? "warn" : ""}/>
        <${Metric} k="Ráfaga máx." v=${A.fmt0(s.maxGust) + " km/h"} tone=${s.maxGust > prefs.maxGust ? "warn" : ""}/>
        <${Metric} k="Temp. / sens." v=${(s.maxTemp == null ? "–" : A.fmt0(s.maxTemp)) + "° / " + A.fmt0(s.minFeels) + "°"} tone=${s.minFeels < prefs.minFeels ? "warn" : ""}/>
        <${Metric} k="Lluvia máx." v=${A.fmt0(s.maxProb) + " %"} tone=${s.maxProb >= 20 || s.totalPrecip > 0 ? "warn" : ""}/>
      </div>
      ${w.level !== "ideal" && html`<${Reasons} reasons=${w.reasons} prefs=${prefs} max=${3}/>`}
    </button>`;
  }

  function Opportunities(props) {
    var a = props.analysis;
    var nDays = a.days.filter(function (d) { return d.recs.length; }).length;
    return html`<section>
      <div className="section-h"><h2>Próximos asados posibles</h2><span>${a.recs.length ? nDays + (nDays === 1 ? " día con opciones" : " días con opciones") : "Sin opciones"}</span></div>
      <p className="disclaimer" style=${{ margin: "4px 2px 10px" }}>Solo ventanas ideales o con precauciones de ${a.prefs.duration} h (${a.slot.label.toLowerCase()}, ${a.slot.hint}), sin superponerse, ordenadas por puntaje. Tocá una para verla hora por hora.</p>
      <div className="opps">
        ${a.recs.length ? a.recs.map(function (w, i) {
          return html`<${OppCard} key=${w.date + "-" + w.startHour} w=${w} index=${i} analysis=${a} selected=${props.selected === w.date} onSelect=${function () { props.onSelect(w.date); }}/>`;
        }) : html`<div className="opp empty" data-none="true"><strong>Sin oportunidades</strong><p>${noneText(a)}</p></div>`}
      </div>
    </section>`;
  }

  function Discarded(props) {
    var a = props.analysis, list = a.discarded;
    if (!list.length) return null;
    return html`<details className="method discarded">
      <summary>Días sin condiciones favorables (${list.length}) <span className="chev"><${I.chev} size=${18}/></span></summary>
      <div className="discard-list">
        ${list.map(function (d) {
          var x = d.discard;
          var verdict = x.kind === "pasado" ? "Sin horarios restantes" : x.kind === "sindatos" ? "Sin datos suficientes" : "No conviene hacer asado";
          return html`<div key=${d.date} className="discard-item" data-date=${d.date}>
            <div className="discard-title"><span className=${"dot-tone tone-" + (x.kind === "clima" || x.kind === "fragmentado" ? "no" : "pasado")}></span><strong>${fullDay(d.date, a.today)} — ${verdict}</strong></div>
            <p>${A.discardText(d, a.prefs)}</p>
            ${x.reasons.length > 1 && html`<${Reasons} reasons=${x.reasons.slice(1, 3)} prefs=${a.prefs}/>`}
            ${x.kind !== "pasado" && html`<button className="btn" style=${{ marginTop: "8px", fontSize: "13px", padding: "6px 12px" }} onClick=${function () { props.onSelect(d.date); }}>Ver hora por hora</button>`}
          </div>`;
        })}
      </div>
    </details>`;
  }

  /* ---- Gráfico horario ---- */
  function HourChart(props) {
    var day = props.day, a = props.analysis, prefs = a.prefs;
    var hours = day.hours;
    var n = hours.length;
    var W = 360, Hh = 230, pl = 30, pr = 30, pt = 18, pb = 30;
    var plotW = W - pl - pr, plotH = Hh - pt - pb;
    var bw = plotW / Math.max(n, 1);
    var gusts = hours.map(function (h) { return h.gust; }).filter(function (v) { return v != null; });
    var maxY = Math.max(50, Math.ceil((gusts.length ? Math.max.apply(null, gusts) : 0) / 10) * 10);
    var temps = [];
    hours.forEach(function (h) { if (h.temp != null) temps.push(h.temp); if (h.feels != null) temps.push(h.feels); });
    var tMin = temps.length ? Math.floor((Math.min.apply(null, temps) - 1) / 5) * 5 : 0;
    var tMax = temps.length ? Math.ceil((Math.max.apply(null, temps) + 1) / 5) * 5 : 20;
    if (tMax - tMin < 10) tMax = tMin + 10;
    var x = function (i) { return pl + (i + 0.5) * bw; };
    var y = function (v) { return pt + plotH - (v / maxY) * plotH; };
    var yt = function (v) { return pt + plotH - ((v - tMin) / (tMax - tMin)) * plotH; };
    var rainH = plotH * 0.32;
    var path = function (key, sy) {
      var d = "", pen = false;
      hours.forEach(function (h, i) {
        var v = h[key];
        if (v == null) { pen = false; return; }
        d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + sy(v).toFixed(1);
        pen = true;
      });
      return d;
    };
    var sel = props.selectedHour;
    var selIdx = hours.findIndex(function (h) { return h.hour === sel; });
    var recs = day.recs || [];
    var tone = { ideal: "var(--good)", precaucion: "var(--warn)", no: "var(--bad)", sindatos: "var(--muted)" };
    var opac = { ideal: 0.2, precaucion: 0.16, no: 0.1, sindatos: 0.06 };
    var gridVals = [];
    for (var g = 0; g <= maxY; g += maxY > 60 ? 20 : 10) gridVals.push(g);
    var tTicks = [];
    for (var tt = tMin; tt <= tMax; tt += (tMax - tMin) > 20 ? 10 : 5) tTicks.push(tt);
    var wrapRef = useRef(null);

    function pick(clientX) {
      var el = wrapRef.current; if (!el) return;
      var r = el.getBoundingClientRect();
      var vx = (clientX - r.left) / r.width * W;
      var i = Math.floor((vx - pl) / bw);
      if (i >= 0 && i < n) props.onHour(hours[i].hour);
    }

    return html`<div className="chart-wrap" ref=${wrapRef}
        onPointerDown=${function (e) { pick(e.clientX); }}
        onPointerMove=${function (e) { if (e.pointerType === "mouse" || e.buttons) pick(e.clientX); }}>
      <svg viewBox=${"0 0 " + W + " " + Hh} role="img" aria-label=${"Gráfico horario del " + A.weekday(day.date) + ": viento, ráfagas, temperatura y probabilidad de lluvia"}>
        ${hours.map(function (h, i) {
          return html`<g key=${"bg" + i}>
            ${h.inSlot && !h.past && html`<rect x=${pl + i * bw} y=${pt} width=${bw} height=${plotH} fill=${tone[h.cls.level]} fillOpacity=${opac[h.cls.level]}/>`}
            ${h.isDay === 0 && html`<rect x=${pl + i * bw} y=${pt} width=${bw} height=${plotH} fill="var(--night)"/>`}
            ${h.past && html`<rect x=${pl + i * bw} y=${pt} width=${bw} height=${plotH} fill="var(--past)"/>`}
          </g>`;
        })}
        ${gridVals.map(function (v) {
          return html`<g key=${"gy" + v}><line x1=${pl} x2=${W - pr} y1=${y(v)} y2=${y(v)} stroke="var(--line)" strokeWidth="0.6"/>
            <text x=${pl - 4} y=${y(v) + 3} textAnchor="end" fontSize="8.5" fill="var(--muted)" className="num">${v}</text></g>`;
        })}
        ${tTicks.map(function (v) {
          return html`<text key=${"ty" + v} x=${W - pr + 4} y=${yt(v) + 3} fontSize="8.5" fill="var(--temp)" className="num">${v}°</text>`;
        })}
        <text x=${pl - 4} y=${pt - 7} textAnchor="end" fontSize="8" fill="var(--muted)">km/h</text>
        <text x=${W - pr + 4} y=${pt - 7} fontSize="8" fill="var(--temp)">°C</text>
        <line x1=${pl} x2=${W - pr} y1=${y(A.HARD.gust)} y2=${y(A.HARD.gust)} stroke="var(--bad)" strokeWidth="0.9" strokeDasharray="1.5 2.5"/>
        <text x=${W - pr - 2} y=${y(A.HARD.gust) - 3} textAnchor="end" fontSize="7.5" fill="var(--bad)">límite ráfagas 40</text>
        <line x1=${pl} x2=${W - pr} y1=${y(prefs.maxWind)} y2=${y(prefs.maxWind)} stroke="var(--ember)" strokeWidth="0.9" strokeDasharray="1.5 2.5"/>
        <text x=${pl + 3} y=${y(prefs.maxWind) - 3} fontSize="7.5" fill="var(--ember)">tu viento máx. ${prefs.maxWind}</text>
        ${hours.map(function (h, i) {
          if (h.prob == null || h.prob <= 0) return null;
          var hgt = rainH * h.prob / 100;
          return html`<rect key=${"r" + i} x=${pl + i * bw + bw * 0.2} y=${pt + plotH - hgt} width=${bw * 0.6} height=${hgt} rx="1.2" fill="var(--rain)" fillOpacity="0.55"/>`;
        })}
        ${recs.map(function (r, k) {
          var i0 = hours.findIndex(function (h) { return h.hour === r.startHour; });
          if (i0 < 0) return null;
          var x0 = pl + i0 * bw + 0.5, wd = bw * (r.endHour - r.startHour) - 1;
          var lw = k === 0 ? 52 : 40, lx = Math.min(x0, W - pr - lw);
          return html`<g key=${"rec" + r.startHour} className="rec-mark">
            <rect x=${x0} y=${pt + 0.5} width=${wd} height=${plotH - 1} fill="none" stroke="var(--ember)" strokeWidth=${k === 0 ? 1.6 : 1} strokeDasharray=${k === 0 ? null : "3 2"} rx="3"/>
            <rect x=${lx} y=${pt - 12} width=${lw} height="11" rx="3" fill="var(--ember)" fillOpacity=${k === 0 ? 1 : 0.75}/>
            <text x=${lx + 4} y=${pt - 4} fontSize="7.5" fontWeight="700" fill="#fff">${k === 0 ? "MEJOR · " : "ALT. · "}${r.score}</text>
          </g>`;
        })}
        <path d=${path("temp", yt)} fill="none" stroke="var(--temp)" strokeWidth="1.6"/>
        <path d=${path("gust", y)} fill="none" stroke="var(--bad)" strokeWidth="1.6" strokeDasharray="4 2.5"/>
        <path d=${path("wind", y)} fill="none" stroke="var(--ember)" strokeWidth="2.4"/>
        ${selIdx >= 0 && html`<g>
          <line x1=${x(selIdx)} x2=${x(selIdx)} y1=${pt} y2=${pt + plotH} stroke="var(--ink)" strokeWidth="0.8"/>
          ${hours[selIdx].wind != null && html`<circle cx=${x(selIdx)} cy=${y(hours[selIdx].wind)} r="3" fill="var(--ember)" stroke="var(--surface)" strokeWidth="1.2"/>`}
          ${hours[selIdx].gust != null && html`<circle cx=${x(selIdx)} cy=${y(hours[selIdx].gust)} r="3" fill="var(--bad)" stroke="var(--surface)" strokeWidth="1.2"/>`}
          ${hours[selIdx].temp != null && html`<circle cx=${x(selIdx)} cy=${yt(hours[selIdx].temp)} r="3" fill="var(--temp)" stroke="var(--surface)" strokeWidth="1.2"/>`}
        </g>`}
        ${hours.map(function (h, i) {
          if (h.hour % 3 !== 0) return null;
          return html`<text key=${"x" + i} x=${x(i)} y=${Hh - pb + 12} textAnchor="middle" fontSize="8.5" fill="var(--muted)" className="num">${(h.hour < 10 ? "0" : "") + h.hour}</text>`;
        })}
        ${hours.map(function (h, i) {
          return html`<rect key=${"lv" + i} x=${pl + i * bw + 0.6} y=${Hh - pb + 17} width=${bw - 1.2} height="4" rx="1" fill=${h.past ? "var(--line)" : tone[h.cls.level]} fillOpacity=${h.inSlot ? 1 : 0.35}/>`;
        })}
      </svg>
    </div>`;
  }

  function HourDetail(props) {
    var h = props.hour, prefs = props.prefs;
    var so = useState(false), open = so[0], setOpen = so[1];
    useEffect(function () { setOpen(false); }, [h && h.time]);
    if (!h) return null;
    var ex = props.analysis ? A.explainWindow(props.analysis, h.date, h.hour, prefs.duration) : null;
    return html`<div className="hour-detail" aria-live="polite">
      <div className="row1"><${WeatherIcon} code=${h.code} isDay=${h.isDay} size=${24}/><strong className="num">${A.hh(h.hour)}</strong><span style=${{ color: "var(--muted)", fontSize: "13.5px" }}>${A.weatherText(h.code)}</span>
        ${h.past ? html`<${Badge} level="pasado" label="Ya pasó"/>` : html`<${Badge} level=${h.cls.level}/>`}
        ${!h.inSlot && !h.past && html`<span style=${{ color: "var(--muted)", fontSize: "12px" }}>Fuera de tu franja</span>`}
      </div>
      <div className="src-t" style=${{ marginTop: "6px" }}>Valores del pronóstico de Open-Meteo, no mediciones.</div>
      <div className="grid">
        <div><div className="k">Viento</div><div className="v num" style=${{ display: "flex", alignItems: "center", gap: "4px" }}>${h.wind == null ? "–" : A.fmt0(h.wind) + " km/h"} ${h.dir != null && html`<${I.arrow} deg=${h.dir} size=${13}/>`}</div></div>
        <div><div className="k">Ráfagas</div><div className="v num">${h.gust == null ? "–" : A.fmt0(h.gust) + " km/h"}</div></div>
        <div><div className="k">Dirección</div><div className="v">${h.dir == null ? "–" : "Del " + A.cardinal(h.dir)}</div></div>
        <div><div className="k">Temperatura</div><div className="v num">${h.temp == null ? "–" : A.fmt0(h.temp) + " °C"}</div></div>
        <div><div className="k">Sensación</div><div className="v num">${h.feels == null ? "–" : A.fmt0(h.feels) + " °C"}</div></div>
        <div><div className="k">Lluvia</div><div className="v num">${h.prob == null ? "–" : A.fmt0(h.prob) + " %"} · ${h.precip == null ? "–" : A.fmt1(h.precip) + " mm"}</div></div>
      </div>
      ${h.cls.level !== "ideal" && html`<${Reasons} reasons=${h.cls.reasons} prefs=${prefs}/>`}
      ${ex && ex.status !== "recomendada" && html`<div className="why-box">
        <button className="btn why-btn" aria-expanded=${open ? "true" : "false"} onClick=${function () { setOpen(!open); }}>¿Por qué no me recomendaste este horario?</button>
        ${open && html`<div className="why-ans" aria-live="polite">
          <div className="eyebrow">Ventana ${ex.label} (${prefs.duration} h)</div>
          <p>${ex.text}</p>
          ${ex.lines.length > 0 && html`<ul className="reasons">${ex.lines.map(function (l) { return html`<li key=${l.hour + l.texts[0]} className=${l.sev === "no" ? "no" : ""}><strong className="num">${A.hh(l.hour)}</strong> — ${l.texts.join("; ")}</li>`; })}</ul>`}
        </div>`}
      </div>`}
      ${ex && ex.status === "recomendada" && html`<p className="src-foot" style=${{ marginTop: "8px" }}>${ex.text}</p>`}
    </div>`;
  }

  function ChartSection(props) {
    var a = props.analysis;
    var day = a.days.find(function (d) { return d.date === props.date; }) || a.days[0];
    var defHour = useMemo(function () {
      if (!day) return null;
      if (day.top) return day.top.startHour;
      var f = day.hours.find(function (h) { return !h.past; });
      return f ? f.hour : day.hours[0] && day.hours[0].hour;
    }, [day && day.date, a]);
    var st = useState(null), hour = st[0], setHour = st[1];
    useEffect(function () { setHour(defHour); }, [defHour]);
    if (!day) return null;
    var hObj = day.hours.find(function (h) { return h.hour === hour; });
    var tone = function (d) { return d.top ? d.top.level : d.discard && (d.discard.kind === "clima" || d.discard.kind === "fragmentado") ? "no" : "pasado"; };
    return html`<section ref=${props.sectionRef}>
      <div className="section-h"><h2>Hora por hora</h2><span>Tocá el gráfico</span></div>
      <div className="chart-card" style=${{ marginTop: "10px" }}>
        <div className="days" role="group" aria-label="Elegí el día">
          ${a.days.map(function (d) {
            return html`<button key=${d.date} className=${"day-chip tone-" + tone(d)} aria-pressed=${d.date === day.date ? "true" : "false"} onClick=${function () { props.onDate(d.date); }}>
              <span className="d">${A.dayLabel(d.date, a.today).slice(0, d.isToday ? 3 : 3)}</span><span className="dd num">${A.shortDate(d.date)}</span><span className="bar"></span>
            </button>`;
          })}
        </div>
        <div className="sun-row">
          ${day.sunrise && html`<span><${I.sunrise} size=${15}/>Sale el sol ${day.sunrise.slice(11, 16)}</span>`}
          ${day.sunset && html`<span><${I.sunset} size=${15}/>Se pone ${day.sunset.slice(11, 16)}</span>`}
          ${day.code != null && html`<span><${WeatherIcon} code=${day.code} size=${16}/>${A.weatherText(day.code)}</span>`}
        </div>
        <${HourChart} day=${day} analysis=${a} selectedHour=${hour} onHour=${setHour}/>
        <div className="legend">
          <span><i style=${{ borderColor: "var(--ember)" }}></i>Viento</span>
          <span><i className="dash" style=${{ borderColor: "var(--bad)" }}></i>Ráfagas</span>
          <span><i style=${{ borderColor: "var(--temp)" }}></i>Temperatura</span>
          <span><i className="box" style=${{ background: "var(--rain)", opacity: 0.6 }}></i>Prob. de lluvia</span>
          <span><i className="box" style=${{ background: "var(--good)", opacity: 0.45 }}></i>Ideal</span>
          <span><i className="box" style=${{ background: "var(--warn)", opacity: 0.45 }}></i>Precaución</span>
          <span><i className="box" style=${{ background: "var(--bad)", opacity: 0.35 }}></i>No conviene</span>
        </div>
        <${HourDetail} hour=${hObj} prefs=${a.prefs} analysis=${a}/>
      </div>
    </section>`;
  }

  /* ---- Método ---- */
  var BD_LABEL = { viento: ["Viento sostenido", 25], rafagas: ["Ráfagas", 25], lluvia: ["Lluvia", 20], temperatura: ["Sensación térmica", 15], cielo: ["Estado del cielo", 10], luz: ["Luz natural", 5] };
  function Method(props) {
    var a = props.analysis, p = a.prefs, o = a.overall;
    return html`<details className="method">
      <summary>Cómo se calcula <span className="chev"><${I.chev} size=${18}/></span></summary>
      <div className="method-body">
        <p>Para cada día se evalúan todas las ventanas de ${p.duration} horas seguidas dentro de tu franja (${a.slot.hint}); la última puede terminar a la medianoche. Cada hora se evalúa por separado con el pronóstico horario de Open-Meteo, y la ventana queda en la categoría de su <strong>peor hora</strong>. No se usan promedios diarios.</p>
        <p>Solo se recomiendan ventanas ideales o con precauciones. Por cada tramo continuo de horas ideales se elige su mejor ventana, y después se buscan alternativas con precauciones fuera de esos tramos. Las ventanas recomendadas no se superponen (hasta ${A.MAX_RECS_PER_DAY} por día) y se ordenan por puntaje. Un día sin ninguna ventana aceptable pasa a “Días sin condiciones favorables” con el motivo que más horas afecta; nunca se completa la lista con horarios desfavorables.</p>
        <p>Si dos ventanas de la misma categoría quedan a ${A.DAY_PREF_MARGIN} puntos o menos, se prefiere la que tiene luz de día completa. Esa preferencia nunca cambia una categoría ni un límite.</p>
        <p>La observación del aeropuerto (METAR de SAWG, de menos de ${A.OBS_MAX_AGE} minutos) solo puede volver “no conviene” la hora actual y la siguiente, si informa ráfagas de más de 40 km/h, viento de más de 30 km/h, lluvia o tormenta. Nunca mejora una hora: un METAR sin ráfagas no prueba que no las haya.</p>
        <h4>Categorías</h4>
        <div className="tbl-wrap"><table className="rules">
          <thead><tr><th></th><th>Ideal</th><th>Con precauciones</th><th>No conviene</th></tr></thead>
          <tbody>
            <tr><td>Viento sostenido</td><td className="num">≤ ${p.maxWind} km/h</td><td className="num">≤ 30 km/h</td><td className="num">${"> 30 km/h"}</td></tr>
            <tr><td>Ráfagas</td><td className="num">≤ ${p.maxGust} km/h</td><td className="num">≤ 40 km/h</td><td className="num">${"> 40 km/h"}</td></tr>
            <tr><td>Lluvia prevista</td><td>0 mm</td><td className="num">${"< 0,5 mm/h"}</td><td className="num">${"≥ 0,5 mm/h"}</td></tr>
            <tr><td>Prob. de lluvia</td><td className="num">${"< 20 %"}</td><td className="num">${"< 50 %"}</td><td className="num">${"≥ 50 %"}</td></tr>
            <tr><td>Sensación térmica</td><td className="num">≥ ${p.minFeels} °C</td><td className="num">≥ ${p.minFeels - 5} °C</td><td className="num">${"< " + (p.minFeels - 5) + " °C"}</td></tr>
            <tr><td>Tormenta o nieve</td><td>No</td><td>No</td><td>Sí</td></tr>
          </tbody>
        </table></div>
        <p style=${{ marginTop: "10px" }}>Los límites de 30 km/h de viento y 40 km/h de ráfagas son fijos: la configuración puede volverlos más exigentes, nunca más permisivos. El viento manda: un día soleado y templado con ráfagas fuertes nunca sale como ideal. La opción de parrilla protegida solo mejora el puntaje de comodidad (cuenta el viento sostenido al ${Math.round(A.PROTECTED_FACTOR * 100)} %) y no cambia ninguna categoría ni advertencia.</p>
        <h4>Puntaje de 0 a 100</h4>
        <p>Primero se suma un puntaje de comodidad sobre 100 puntos: viento sostenido (25, pleno hasta 10 km/h y cero a 30), ráfagas (25, pleno hasta 20 km/h y cero a 40), lluvia (20, según la probabilidad máxima y a la mitad si hay milímetros previstos), sensación térmica (15), estado del cielo (10) y luz natural (5). Después se ubica en la banda de su categoría: ideal de 70 a 100, con precauciones de 40 a 69 y no conviene de 0 a 39. Así una ventana ideal siempre queda arriba de una con precauciones.</p>
        ${o && o.breakdown && html`<div>
          <h4>Detalle de la mejor ventana (${A.dayPhrase(o.date, a.today)}, ${A.hh(o.startHour)}–${A.hh(o.endHour)})</h4>
          <div className="bd">
            ${Object.keys(BD_LABEL).map(function (k) {
              var v = o.breakdown[k], m = BD_LABEL[k][1];
              return html`<${React.Fragment} key=${k}><span>${BD_LABEL[k][0]}</span><div className="track"><div className="fill" style=${{ width: (v / m * 100) + "%" }}></div></div><span className="num">${A.fmt1(v)} / ${m}</span><//>`;
            })}
            <strong>Comodidad</strong><span></span><strong className="num">${A.fmt1(o.raw)} / 100</strong>
            <strong>Puntaje final</strong><span style=${{ color: "var(--muted)", fontSize: "12px" }}>${LEVEL_LABEL[o.level]}</span><strong className="num">${o.score}</strong>
          </div>
        </div>`}
        <h4>Datos</h4>
        <p>Pronóstico de Open-Meteo para ${A.LOCATION.lat}, ${A.LOCATION.lon}, huso horario de Río Gallegos (UTC−3). Viento y ráfagas a 10 m de altura. Si una hora no trae algún dato, la ventana se marca “Sin datos” y no se recomienda.</p>
      </div>
    </details>`;
  }

  /* ---- Ajustes ---- */
  function Seg(props) {
    return html`<div className="seg" role="group" aria-label=${props.label}>
      ${props.options.map(function (o) {
        return html`<button key=${String(o.value)} id=${props.id + "-" + o.value} aria-pressed=${props.value === o.value ? "true" : "false"} onClick=${function () { props.onChange(o.value); }}>${o.label}${o.hint && html`<small>${o.hint}</small>`}</button>`;
      })}
    </div>`;
  }

  function Settings(props) {
    var p = props.prefs, set = function (k, v) { var n = Object.assign({}, p); n[k] = v; props.onChange(A.sanitizePrefs(n)); };
    useEffect(function () {
      var onKey = function (e) { if (e.key === "Escape") props.onClose(); };
      document.addEventListener("keydown", onKey);
      return function () { document.removeEventListener("keydown", onKey); };
    }, []);
    return html`<${React.Fragment}>
      <div className="sheet-backdrop" onClick=${props.onClose}></div>
      <div className="sheet" role="dialog" aria-modal="true" aria-labelledby="ajustes-titulo">
        <div className="sheet-inner">
          <div className="grab"></div>
          <div className="sheet-head"><h2 id="ajustes-titulo">Tus preferencias</h2><button className="icon-btn" onClick=${props.onClose} aria-label="Cerrar"><${I.close}/></button></div>
          <div className="field">
            <div className="field-label"><span className="t">Duración del asado</span><output>${p.duration} horas</output></div>
            <${Seg} id="dur" label="Duración" value=${p.duration} onChange=${function (v) { set("duration", v); }} options=${[2, 3, 4, 5].map(function (n) { return { value: n, label: n + " h" }; })}/>
          </div>
          <div className="field">
            <div className="field-label"><span className="t">Horario preferido</span></div>
            <${Seg} id="slot" label="Horario" value=${p.slot} onChange=${function (v) { set("slot", v); }} options=${["libre", "almuerzo", "tarde", "noche"].map(function (k) { return { value: k, label: A.SLOTS[k].label, hint: A.SLOTS[k].hint }; })}/>
          </div>
          <div className="field">
